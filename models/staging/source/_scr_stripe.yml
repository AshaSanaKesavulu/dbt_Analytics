sources:
  - name: stripe
    description: >
      Raw Stripe payment data containing payment transactions
      associated with customer orders.

    database: raw
    schema: stripe

    tables:
      - name: payments
        description: >
          Raw payment transaction data containing payment status,
          amount, creation timestamp, and associated order.

        columns:
          - name: id
            description: "Unique identifier for each payment."
            data_tests:
              - unique
              - not_null

          - name: orderid
            description: "Identifier of the order associated with the payment."
            data_tests:
              - not_null

          - name: created
            description: "Timestamp when the payment was created."
            data_tests:
              - not_null