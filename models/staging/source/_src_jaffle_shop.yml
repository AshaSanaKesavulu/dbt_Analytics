sources:
  - name: jaffle_shop
    description: "Raw Jaffle Shop data containing customer and order information. These tables are loaded into the raw database and serve as the source data for downstream dbt staging models."
    database: raw
    schema: jaffle_shop

    tables:
      - name: customers
        description: "Raw customer data containing information about customers of the Jaffle Shop."
        columns:
          - name: id
            description: "Unique identifier for each customer."
            data_tests:
              - unique
              - not_null
      - name: payments
        description: "Raw payment data containing payment information associated with customer orders."
        columns:
          - name: id
            description: "Unique identifier for each payment."
            data_tests:
              - unique
              - not_null

      - name: orders
        description: "Raw order data containing information about customer orders, including order status and the associated customer."
        columns:
          - name: id
            description: "Unique identifier for each order."
            data_tests:
              - unique
              - not_null
        
        
        config:
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 1
              period: day
          loaded_at_field: _etl_loaded_at
