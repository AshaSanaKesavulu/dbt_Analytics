models:
  - name: int_orders
    description: >
      Intermediate model that combines order information with successful
      payment information. It calculates the total amount paid and the date
      when payment was finalized for each order.

    columns:
      - name: order_id
        description: "Unique identifier for the customer order."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Unique identifier of the customer associated with the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id

      - name: order_date
        description: "Date on which the order was placed."
        data_tests:
          - not_null

      - name: order_status
        description: "Current status of the customer order."

      - name: total_amount_paid
        description: >
          Total amount paid for the order, calculated by summing all successful
          payment transactions associated with the order.

      - name: payment_finalized_date
        description: >
          Date and time of the most recent successful payment associated with
          the order.